      <stop offset="0" stop-color="#1c2150"/>
      <stop offset="0.55" stop-color="#12163a"/>
      <stop offset="1" stop-color="#090b1c"/>
    </radialGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="90" y1="96" x2="380" y2="416">
      <stop offset="0" stop-color="#8fa4ff"/>
      <stop offset="1" stop-color="#2e4fe8"/>
    </linearGradient>
